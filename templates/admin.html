<!DOCTYPE html>
<html>

<head>
    <title>Admin - Tetes Coffee</title>
</head>

<body style="
    background:#3E2723;
    color:white;
    font-family:Arial;
    text-align:center;
">

    <h1>Panel de pedidos ☕</h1>

    <table border="1" style="
        margin:auto;
        background:white;
        color:black;
        border-collapse: collapse;
        width:70%;
    ">

        <tr style="
            background:#6D4C41;
            color:white;
        ">
            <th>ID</th>
            <th>Nombre</th>
            <th>Bebida</th>
        </tr>

        {% for p in pedidos %}

        <tr>
            <td>{{ p[0] }}</td>
            <td>{{ p[1] }}</td>
            <td>{{ p[2] }}</td>
        </tr>

        {% endfor %}

    </table>

</body>
</html>
